[package]
name = "lumi"
version = "0.1.3"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[[bin]]
name = "lumi"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
