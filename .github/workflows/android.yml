name: Build Android app (APK)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "HTTPS URL of the deployed Lumi site (e.g. https://lumi.vercel.app). Leave blank to use the APP_URL repo variable."
        required: false
        default: ""
  workflow_call:
    inputs:
      app_url:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve APP_URL and host
        id: url
        run: |
          URL="${{ inputs.app_url }}"
          [ -z "$URL" ] && URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::No APP_URL. Pass the app_url input or set the APP_URL repo variable."
            exit 1
          fi
          URL="${URL%/}"
          HOST="$(printf '%s' "$URL" | sed -E 's#^https?://##; s#/.*$##')"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Building TWA for host: $HOST"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default `packages` is "tools platform-tools", but the
          # legacy "tools" package was removed from the SDK repo, so installing
          # it fails ("Failed to find package 'tools'"). Install only
          # platform-tools; Bubblewrap pulls the build-tools/platforms it needs.
          packages: platform-tools

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner JDK and Android SDK
        run: |
          # `bubblewrap updateConfig` calls loadOrCreateConfig(), which prompts
          # interactively ("install the JDK?") whenever ~/.bubblewrap/config.json
          # is missing or has an empty jdkPath/androidSdkPath — fatal in CI
          # (readline ERR_USE_AFTER_CLOSE). Write the config file directly with
          # both paths pre-filled; Config.loadConfig reads these exact field
          # names, so loadOrCreateConfig finds them set and never prompts.
          #
          # Bubblewrap also expects a flat SDK layout: it validates the SDK by
          # checking for $SDK/tools or $SDK/bin, and runs sdkmanager from
          # $SDK/bin/sdkmanager. The runner's SDK keeps cmdline-tools under
          # cmdline-tools/<ver>/bin, so expose that bin dir as $ANDROID_HOME/bin.
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMGR" ]; then echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; fi
          ln -sfn "$(dirname "$SDKMGR")" "$ANDROID_HOME/bin"
          ls -l "$ANDROID_HOME/bin/sdkmanager"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore from secret
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set. See README (Android build)."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > android/android.keystore
          test -s android/android.keystore

      - name: Fill in deployed host, key alias and build number
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sed -i "s/APP_HOST_PLACEHOLDER/${{ steps.url.outputs.host }}/g" twa-manifest.json
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionCode=${{ github.run_number }};if(process.env.KEY_ALIAS)m.signingKey.alias=process.env.KEY_ALIAS;require('fs').writeFileSync(f,JSON.stringify(m,null,2));"
          cat twa-manifest.json

      - name: Accept SDK licenses and pre-install build tools
        run: |
          # Earlier `yes | sdkmanager --licenses` ran via the symlinked
          # sdkmanager, silently no-opped (hidden by `|| true` + `>/dev/null`),
          # and left the build-tools license UNaccepted. `bubblewrap build` then
          # ran `sdkmanager --install "build-tools;36.1.0"`, hit the "Accept?
          # (y/N)" prompt, and our blank-line stdin never answered "y" — it
          # re-prompted in a tight loop, producing ~1.8 GB of output until the
          # timeout killed it. Fix both halves:
          #
          # 1) Accept licenses WITHOUT depending on sdkmanager, by writing the
          #    well-known public license-hash files directly. This is the
          #    canonical headless-CI method and cannot silently no-op.
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          # 2) Pre-install exactly what bubblewrap requests, using the REAL
          #    sdkmanager (full path, not the symlink), so bubblewrap's own
          #    install is a no-op and never prompts. Show output + exit code.
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMGR"
          "$SDKMGR" --install "platform-tools" "build-tools;36.1.0" "platforms;android-36" 2>&1 | tail -25
          echo "install exit: ${PIPESTATUS[0]}"
          "$SDKMGR" --list_installed 2>&1 | head -40 || true

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set +o pipefail
          # bubblewrap build's version-update flow prompts
          # "? versionName for the new App version:" and REJECTS a blank line,
          # re-prompting forever (observed: 79 reprompts until the 20-min
          # timeout). So blank/`yes ""` input never satisfies it. Feed the REAL
          # versionName + versionCode as the first two answers, then an endless
          # `yes ""` for any later prompt/confirm. Explicit values satisfy the
          # required inputs; the trailing endless feed means stdin never closes,
          # so inquirer never force-closes (no ERR_USE_AFTER_CLOSE) and the build
          # proceeds to produce the signed APK. `tail` caps the log and
          # `timeout` is the final backstop against an unexpected hang.
          export VNAME="$(node -p "require('./twa-manifest.json').appVersionName || '1.0.0'")"
          export VCODE="${{ github.run_number }}"
          echo "feeding versionName=$VNAME versionCode=$VCODE"
          timeout 1200 bash -c '{ printf "%s\n%s\n" "$VNAME" "$VCODE"; yes ""; } | bubblewrap build --skipPwaValidation' 2>&1 | tail -n 80 || true
          test -f app-release-signed.apk

      - name: Collect APK
        working-directory: android
        run: |
          mkdir -p out
          cp app-release-signed.apk out/lumi.apk
          cp app-release-bundle.aab out/lumi.aab 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lumi-android
          path: android/out/*

      - name: Attach APK to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" android/out/lumi.apk --clobber


