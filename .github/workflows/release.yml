name: Release

# Cut a GitHub Release when a version tag (e.g. v0.1.0) is pushed, then build
# and attach the installable apps (Android APK + Windows/macOS/Linux desktop)
# to it. Requires the APP_URL repo variable to point at the deployed site, and
# the Android signing secrets (see README → "Building the installers").
# Tag with:  npm version patch && git push --follow-tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Verify the web build still compiles
        run: |
          npm ci
          npm run build
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes

  android:
    needs: create-release
    uses: ./.github/workflows/android.yml
    secrets: inherit

  desktop:
    needs: create-release
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
